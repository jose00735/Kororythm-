name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (DSP, DJ, library logic, tag writer)
        run: ./gradlew :app:testDebugUnitTest --tests "*DspTest*" --tests "*DjDspTest*" --tests "*LibraryLogicTest*" --tests "*TagIoTest*"

      - name: Check written tags with an independent reader (mutagen + ffmpeg)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install mutagen
          python3 scripts/verify_tags.py

      - name: Screenshot check (Paparazzi)
        run: ./gradlew :app:verifyPaparazziDebug

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kororythm-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-diffs
          path: app/out/failures/
